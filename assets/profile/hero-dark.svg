<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Miguel Almeida — Frontend and Design Engineer</title>
<desc id="desc">Animated editorial header highlighting Second Voice, Flow, Leu and VIGIA.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.eyebrow{fill:#D3A84E;font-size:12px;font-weight:700;letter-spacing:3.1px}
.name{fill:#F2F0EB;font-size:42px;font-weight:760;letter-spacing:-1.4px}
.role{fill:#9EA3A8;font-size:17px;font-weight:520}
.small{fill:#9EA3A8;font-size:11px;font-weight:650;letter-spacing:1.7px}
.hair{stroke:#30363D;stroke-width:1}
.accent{stroke:#D3A84E;stroke-width:2;stroke-linecap:round}
.num{fill:#D3A84E;font-size:10px;font-weight:750;letter-spacing:1.4px}
.pname{fill:#F2F0EB;font-size:12px;font-weight:730;letter-spacing:.5px}
.pmeta{fill:#9EA3A8;font-size:8.5px;font-weight:620;letter-spacing:.7px}
.project{opacity:.42;animation:focus 12s infinite}
.p2{animation-delay:3s} .p3{animation-delay:6s} .p4{animation-delay:9s}
.signal{fill:#D3A84E;animation:pulse 2.6s ease-in-out infinite}
.intro{animation:intro 1s ease both}
@keyframes focus{0%,19%,100%{opacity:.42}5%,14%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes intro{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.project{opacity:.82}}
</style>
<defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
<rect width="1000" height="250" rx="18" fill="#0D1117"/>
<g class="intro">
  <circle class="signal" cx="87" cy="39" r="3"/>
  <text class="eyebrow" x="103" y="43">MIGUEL ALMEIDA</text>
  <text class="name" x="84" y="102">Frontend &amp; Design Engineer</text>
  <text class="role" x="86" y="132">AI product interfaces · Berlin</text>
  <text class="small" x="790" y="43">SELECTED SYSTEMS</text>
  <line class="hair" x1="86" y1="158" x2="914" y2="158"/>
  <line class="accent" x1="86" y1="158" x2="180" y2="158"/>

        <g class="project p1" transform="translate(100 194)">
          <text class="num" x="0" y="0">01</text>
          <text class="pname" x="32" y="0">SECOND VOICE</text>
          <text class="pmeta" x="32" y="19">REWRITE · PRIVACY · ROUTING</text>
        </g>
        <g class="project p2" transform="translate(330 194)">
          <text class="num" x="0" y="0">02</text>
          <text class="pname" x="32" y="0">FLOW</text>
          <text class="pmeta" x="32" y="19">VOICE · INTERACTION · STATE</text>
        </g>
        <g class="project p3" transform="translate(500 194)">
          <text class="num" x="0" y="0">03</text>
          <text class="pname" x="32" y="0">LEU</text>
          <text class="pmeta" x="32" y="19">NATIVE IOS · LEARNING · PDF</text>
        </g>
        <g class="project p4" transform="translate(650 194)">
          <text class="num" x="0" y="0">04</text>
          <text class="pname" x="32" y="0">VIGIA</text>
          <text class="pmeta" x="32" y="19">GEOSPATIAL · INCIDENTS · POSTGIS</text>
        </g>
  <line class="hair" x1="86" y1="225" x2="914" y2="225"/>
  <text class="small" x="86" y="242">INTERACTION STATE · ACCESSIBILITY · SECURITY BOUNDARIES · END-TO-END VERIFICATION</text>
  <circle r="4" cy="158" fill="#D3A84E" filter="url(#soft)">
    <animate attributeName="cx" values="86;914;86" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;1;.2" dur="12s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>